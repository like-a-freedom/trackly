global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'trackly'
    replica: '1'

scrape_configs:
  # Backend metrics
  - job_name: 'trackly_backend'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'backend'
          component: 'api'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Frontend Caddy metrics  
  - job_name: 'trackly_frontend'
    static_configs:
      - targets: ['frontend:2019']
        labels:
          service: 'frontend'
          component: 'proxy'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # PostgreSQL metrics (if using postgres_exporter)
  - job_name: 'trackly_postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    # Optional: remove this section if not using postgres_exporter

  # Node exporter (host metrics)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'host'
          component: 'system'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

# Remote write configuration for VictoriaMetrics
#
# NOTE: no write_relabel_configs here on purpose. Dropping labels at remote-write
# time breaks the pipeline:
#   - filtering to *_bucket/_sum/_count drops every counter and gauge,
#   - labelkeep without `le` breaks every histogram_quantile (latency percentiles),
#   - labelkeep without `code` breaks the Caddy 5xx error-rate alert,
#   - dropping `session_hash` breaks all product recording rules (engagement/retention).
# Cardinality (mainly `session_hash` on trackly_session_heartbeat) is managed in
# VictoriaMetrics via retention + -search.maxUniqueTimeseries / -maxLabelValueLength.
remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    queue_config:
      max_samples_per_send: 10000
      max_shards: 30
      capacity: 50000
