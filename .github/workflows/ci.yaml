name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Check for orphan symbols
        run: ../.github/scripts/check-orphans.sh
      - run: cargo test
      - run: cargo build --release

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: bun run build:wasm
      - run: bun run lint
      - run: bun run build
      - run: bun run check:seo
      - run: bun run test

  e2e:
    name: E2E Tests
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: trackly
          POSTGRES_PASSWORD: trackly
          POSTGRES_DB: trackly_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://trackly:trackly@localhost:5432/trackly_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile
      - name: Run database migrations
        working-directory: ./backend
        run: cargo sqlx migrate run
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: ./frontend
        run: bun run test:e2e

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Test backend Docker build
        run: docker build ./backend -t trackly-backend:test
      - name: Test frontend Docker build
        run: docker build ./frontend -t trackly-frontend:test
      - name: Test docker-compose build
        run: docker compose -f docker-compose.dev.yaml build
